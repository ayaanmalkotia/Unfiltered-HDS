<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unfiltered</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <div class="brand">
                <div class="brand-dot"></div>
                UNFILTERED
            </div>

            <div class="live">
                ● LIVE
            </div>
        </header>


        <main>

            <div class="signal">

                <span class="signal-icon">◉</span>

                <span id="signalText">
                    BEHAVIOR SIGNAL
                </span>

            </div>


            <h1 id="headline">
                What's the story?
            </h1>


            <p id="contextText" class="context">
                Looking at your recent behavior...
            </p>


            <textarea
                id="reason"
                placeholder="What's your excuse?"
            ></textarea>


            <button id="submitButton">
                <span>CHECK ME</span>
                <span class="arrow">↗</span>
            </button>


            <div id="loading" class="loading hidden">

                <div class="loader"></div>

                <span>
                    Reading between the lines...
                </span>

            </div>


            <section
                id="responseContainer"
                class="response hidden"
            >

                <div class="response-top">

                    <span class="response-label">
                        UNFILTERED
                    </span>

                    <span id="verdict"
                          class="verdict">
                    </span>

                </div>


                <h2 id="responseHeadline">
                </h2>


                <p id="responseMessage">
                </p>


                <div
                    id="evidence"
                    class="evidence"
                >
                </div>

            </section>

        </main>


        <footer>

            <span>
                Behavior signals only
            </span>

            <span>
                No page content read
            </span>

        </footer>

    </div>


    <script src="popup.js"></script>

</body>

</html>
